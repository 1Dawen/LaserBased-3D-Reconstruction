name: Python tests
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
      - name: Unit tests
        run: python -m pytest -q
      - name: Synthetic reconstruction smoke test
        run: |
          python scripts/generate_demo.py --output data/demo
          python reconstruct.py --background-dir data/demo/colour --laser-dir data/demo/laser --calibration data/demo/calibration.json --frames 24 --angle-step 15 --strict
          python visualize.py --input outputs/reconstructed.xyz --output outputs/preview.png --points 1000
